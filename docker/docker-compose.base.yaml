services:
    db:
        image: mariadb:${MARIADB_VERSION}
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_USER_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql
            - ./config/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
        ports:
            - ${DB_PORT_EXPOSED}:3306
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 5s
            timeout: 5s
            retries: 5

    app:
        build:
            context: ..
            dockerfile: docker/Dockerfile
        environment:
            DATABASE_URL: "mysql://${DB_USER}:${DB_USER_PASSWORD}@db:3306/${DB_NAME}?serverVersion=${DB_VERSION}&charset=utf8mb4"
        depends_on:
            db:
                condition: service_healthy

    webserver:
        image: nginx:${NGINX_VERSION}
        environment:
            SERVER_NAME: ${SERVER_NAME}
        ports:
            - ${SERVER_PORT}:80
        volumes:
            - ./config/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
        depends_on:
            - app

volumes:
    db-data:
