AppBundle\Entity\ProductInfoLocation:
    type: entity
    repositoryClass: AppBundle\Repository\ProductInfoLocationRepository
    table: product_info_location
    id:
        code:
            type: string
            nullable: false
            length: 32
            options:
                fixed: false
            id: true
            generator:
                strategy: IDENTITY
    fields:
        created:
            type: datetime
            nullable: false
            options:
                default: '2000-01-01 00:00:00'
        modified:
            type: datetime
            nullable: true
    lifecycleCallbacks: {  }
