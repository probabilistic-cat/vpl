AppBundle\Entity\Property:
    type: entity
    repositoryClass: AppBundle\Repository\PropertyRepository
    table: property
    id:
        id:
            type: integer
            nullable: false
            options:
                unsigned: true
            id: true
            generator:
                strategy: IDENTITY
    fields:
        name:
            type: string
            nullable: false
            length: 255
            options:
                fixed: false
        created:
            type: datetime
            nullable: false
            options:
                default: '2000-01-01 00:00:00'
        modified:
            type: datetime
            nullable: true
    manyToMany:
        product:
            targetEntity: Product
            cascade: {  }
            fetch: LAZY
            mappedBy: property
            inversedBy: null
            joinTable: null
            orderBy: null
    lifecycleCallbacks: {  }
